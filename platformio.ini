; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
boards_dir = boards
src_dir = examples/ha_calendar

[env]
lib_extra_dirs = ${PROJECT_DIR}
platform = espressif32@6.5.0
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags = 
	-DBOARD_HAS_PSRAM
	
	-DARDUINO_USB_CDC_ON_BOOT=1
	
	
	
	-DCORE_DEBUG_LEVEL=0
	
	-DMQTT_MAX_PACKET_SIZE=8192
monitor_filters = 
	default
	esp32_exception_decoder
lib_deps = 
	lewisxhe/SensorLib @ 0.3.1
	lennarthennigs/Button2 @ 2.3.2
	Wire
	SPI

[env:T5-ePaper-S3]
extends = env
board = T5-ePaper-S3
build_flags = ${env.build_flags}
	-DLILYGO_T5_EPD47_S3
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	knolleary/PubSubClient @ ^2.8

[env:T5-ePaper-S3-OTA]
extends = env:T5-ePaper-S3
extra_scripts = pre:extra_scripts/load_env.py
upload_protocol = espota
upload_flags =
    --timeout=60
; upload_port (and, if needed, extra upload_flags like --auth) are dynamically
; set by load_env.py from .platformio_env, or auto-detected by PlatformIO if
; not provided. This keeps your IP address and OTA password out of git and
; avoids hardcoding the OTA target in this file.
;
; OTA Upload Setup Instructions:
; 1. Copy .platformio_env.example to .platformio_env in the project root
; 2. First upload via USB: pio run -e T5-ePaper-S3 -t upload
; 3. Check serial monitor to see the IP address (look for "IP address: x.x.x.x")
; 4. Update OTA_IP in .platformio_env with the actual IP address
; 5. Update OTA_PASSWORD if you changed it in ha_calendar.ino (default: epd47ota)
; 6. Upload over WiFi: pio run -e T5-ePaper-S3-OTA -t upload
;
; Note: .platformio_env is in .gitignore and will NOT be committed to git.
